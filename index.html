<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discipline</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="art-wallpaper" id="art-wallpaper" aria-hidden="true"></div>
  <div class="app">
    <header class="app-header">
      <h1>Discipline</h1>
      <div class="streak" id="streak"></div>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-view="today">Today</button>
      <button class="tab-btn" data-view="plan">Plan Tomorrow</button>
    </nav>

    <main>
      <section id="view-today" class="view active">
        <div class="view-meta" id="today-date"></div>
        <div class="progress" id="today-progress"></div>
        <ul class="task-list" id="today-list"></ul>
        <p class="empty-state" id="today-empty">No tasks planned for today. Plan tonight for tomorrow.</p>
      </section>

      <section id="view-plan" class="view">
        <div class="view-meta" id="plan-date"></div>
        <form id="plan-form" class="add-form">
          <div class="add-form-row">
            <select id="plan-category" aria-label="Category">
              <option value="">No category</option>
              <option value="Work">Work</option>
              <option value="Health">Health</option>
              <option value="Personal">Personal</option>
              <option value="Learning">Learning</option>
            </select>
            <select id="plan-suggestion" aria-label="Suggested task" hidden></select>
          </div>
          <div class="add-form-row">
            <input type="text" id="plan-input" placeholder="Add a task for tomorrow" autocomplete="off">
            <button type="submit">Add</button>
          </div>
        </form>
        <div class="time-block">
          <div class="time-block-header">
            <span id="time-summary">No time selected</span>
            <button type="button" id="time-clear">Clear</button>
          </div>
          <div class="time-grid" id="time-grid"></div>
        </div>
        <ul class="task-list" id="plan-list"></ul>
        <p class="empty-state" id="plan-empty">Nothing planned yet.</p>
      </section>
    </main>

    <footer class="inspiration">
      <blockquote class="quote">
        <p id="quote-text"></p>
        <cite id="quote-author"></cite>
      </blockquote>
    </footer>
  </div>

  <div class="helix" aria-hidden="true">
    <svg viewBox="0 0 60 200" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg">
      <path d="M30 0 C45 12,45 38,30 50 C15 62,15 88,30 100 C45 112,45 138,30 150 C15 162,15 188,30 200"/>
      <path d="M30 0 C15 12,15 38,30 50 C45 62,45 88,30 100 C15 112,15 138,30 150 C45 162,45 188,30 200"/>
      <line x1="15" y1="25" x2="45" y2="25"/>
      <line x1="15" y1="75" x2="45" y2="75"/>
      <line x1="15" y1="125" x2="45" y2="125"/>
      <line x1="15" y1="175" x2="45" y2="175"/>
    </svg>
  </div>

  <script src="app.js"></script>
</body>
</html>
